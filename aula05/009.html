<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>detran</title>
</head>
<body>
    <h1>Sistema de MULTAS</h1>
    velocidade do carro<input type="number" name="textvel" id="textvel">
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">
        
    </div>
    <script>
        function calcular() { 
            var textv = window.document.getElementById('textvel');
            var res = window.document.getElementById('res');
            var vel = Number(textv.value);
            res.innerHTML = `sua velocidade atual é de ${vel}KM/H<br>`;
            if (vel > 60) {
                res.innerHTML += `<p>VC ESTÁ MULTADO!</p>`
            }
            res.innerHTML += `dirija sempre com cinto de segurança`;
    }
    </script>
</body>
</html>
